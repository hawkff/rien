[package]
name = "ytmpc"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Terminal client for Rien"
repository = "https://github.com/hawkff/rien"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
unicode-width = "0.2"
ureq = { version = "3", default-features = false, features = ["json"] }
